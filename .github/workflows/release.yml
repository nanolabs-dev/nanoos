name: Publish nanoOS release
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release files
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified sharing files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python -c 'import json; print(json.load(open("release.json"))["tag"])')
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; no assets were replaced."
            exit 0
          fi
          gh release create "$tag" nanoOS-share.zip nanoos-qr.png nanoos-qr.svg desktop.png mobile.png SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "nanoOS $tag — nanoLabs" --notes-file RELEASE_NOTES.md --latest
